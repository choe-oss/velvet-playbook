  - !appx: {name: 'Microsoft.VCLibs*', type: family, errorAction: Ignore}

  # 2. Bloatware & OEM Appx Packages Script
  - !run:
    wait: true
    exeDir: true
    exe: "PowerShell"
    args: '-NoP -ExecutionPolicy Bypass -File remove-bloatware.ps1 -Mode Bloatware'
    weight: 120

  # 3. Clear AppX caches
  - !writeStatus: {status: 'Clearing AppX caches'}
  - !appx: {operation: clearCache, name: '*MicrosoftWindows.Client.CBS*', errorAction: Ignore}
  - !appx: {operation: clearCache, name: '*Microsoft.Windows.Search*', errorAction: Ignore}
  - !appx: {operation: clearCache, name: '*Microsoft.Windows.SecHealthUI*', errorAction: Ignore}
