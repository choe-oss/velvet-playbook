---
# =============================================================================
# UWP / Appx Bloatware Removal Task (Tasks\packages\appx.yml)
# Documentation: https://docs.amelabs.net/playbooks/yaml-syntax.html
# =============================================================================

title: APPX
description: Removal of APPX bloatware packages with error tolerance
privilege: Admin

actions:
  - !writeStatus: {status: "Removing Bloatware & OEM Appx Packages"}

  # 1. Native AME AppX Removals (errorAction: Ignore ensures execution continues if app is absent)
