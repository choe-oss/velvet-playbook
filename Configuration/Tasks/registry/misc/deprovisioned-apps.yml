---
# =============================================================================
# 디프로비저닝(Deprovisioned) 앱 등록 매니페스트 (Tasks\registry\misc\deprovisioned-apps.yml)
# 문서 참조: https://docs.amelabs.net/playbooks/yaml-syntax.html
#
# Windows Update 설치 후 또는 새 로컬 사용자 계정이 생성될 때,
# 이전에 삭제했던 기본 UWP 패키지들(Cortana, Bing 앱, Solitaire, Xbox, Store, PC Manager 등)이
# 시스템 프로비저닝 메커니즘에 의해 자동으로 재설치(부활)되는 현상을
# AppxAllUserStore\Deprovisioned 키에 등록하여 영구 차단합니다.
# (기본 사진 앱 Microsoft.Windows.Photos, 일반 그림판 Microsoft.Paint,
#  신형 메모장 Microsoft.WindowsNotepad, 계산기 Microsoft.WindowsCalculator는 보존)
# =============================================================================

title: Configure Deprovisioned Apps
description: Prevents some UWP packages from installing after updating Windows
privilege: TrustedInstaller
actions:

  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Appx\AppxAllUserStore\Deprovisioned\Microsoft.549981C3F5F10_8wekyb3d8bbwe', operation: add}
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Appx\AppxAllUserStore\Deprovisioned\Microsoft.Copilot_8wekyb3d8bbwe', operation: add}

