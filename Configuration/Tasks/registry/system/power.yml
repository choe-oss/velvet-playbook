---
# =============================================================================
# 전원 관리, 절전 모드 및 시간 제한 제어 매니페스트 (Tasks\registry\system\power.yml)
# 문서 참조: https://docs.amelabs.net/playbooks/yaml-syntax.html
#
# 최대 절전 모드(Hibernate) 및 빠른 시작(Fast Startup)을 완전히 비활성화하고,
# 화면 꺼짐(디스플레이 절전), 시스템 절전 모드, 최대 절전 모드 및 디스크 시간 제한을
# 모두 '안 함(0)'으로 설정하여 작업 중 화면 꺼짐 및 대기 모드 진입을 방지합니다.
# =============================================================================

title: configure-power-control
description: Configures power control and disables all sleep/hibernate timeouts
privilege: TrustedInstaller
actions:

  # ---------------------------------------------------------------------------
  # 1. 최대 절전 모드(Hibernate) 및 빠른 시작(Fast Startup) 비활성화
  # ---------------------------------------------------------------------------
  # powercfg 명령을 통해 최대 절전 모드 완전 끄기 및 hiberfil.sys 즉시 삭제
  - !cmd:
    command: 'powercfg -h off'

  # 빠른 시작(Fast Startup) 비활성화 레지스트리
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Power', value: 'HiberbootEnabled', type: REG_DWORD, data: '0'}
  
  # 최대 절전 모드 비활성화 레지스트리
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\Power', value: 'HibernateEnabled', type: REG_DWORD, data: '0'}

  # ---------------------------------------------------------------------------
  # 2. 화면 절전, 시스템 절전, 최대 절전 및 디스크 대기 시간 제한 해제 (0: 안 함)
  # ---------------------------------------------------------------------------
  # 화면(모니터) 끄기 시간 제한 안 함 설정 (AC 전원 및 배터리 모두 0)
  - !cmd:
    command: 'powercfg /change monitor-timeout-ac 0 & powercfg /change monitor-timeout-dc 0'

  # 시스템 절전 모드(Standby) 시간 제한 안 함 설정
  - !cmd:
    command: 'powercfg /change standby-timeout-ac 0 & powercfg /change standby-timeout-dc 0'

  # 최대 절전 모드(Hibernate) 시간 제한 안 함 설정
  - !cmd:
    command: 'powercfg /change hibernate-timeout-ac 0 & powercfg /change hibernate-timeout-dc 0'

  # 하드 디스크 절전(끄기) 시간 제한 안 함 설정
  - !cmd:
    command: 'powercfg /change disk-timeout-ac 0 & powercfg /change disk-timeout-dc 0'

  # ---------------------------------------------------------------------------
  # 3. 전원 메뉴 및 종료 정책 설정
  # ---------------------------------------------------------------------------
  # 시작 메뉴 전원 버튼을 누를 때 '절전(Sleep)' 항목 상시 표시
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\FlyoutMenuSettings', value: 'ShowSleepOption', type: REG_DWORD, data: '1'}

  # 사용자 로그인 화면(잠금 화면)에서 로그인하지 않고도 PC를 종료할 수 있도록 허용
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System', value: 'ShutdownWithoutLogon', type: REG_DWORD, data: '1'}
