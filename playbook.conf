<?xml version="1.0" encoding="utf-8"?>
<!-- 
    =============================================================================
    Velvet Playbook Configuration (playbook.conf)
    Documentation: https://docs.amelabs.net/playbooks/playbook-conf.html
    =============================================================================
-->
<Playbook>
    <!-- Playbook Information -->
    <Name>Velvet</Name>
    <Username>Velvet</Username>
    <Title>Velvet</Title>
    <ShortDescription>Velvet Playbook for Windows</ShortDescription>
    <Description>This Playbook deploys Velvet on your system, optimized for maximum performance, privacy, and responsiveness.</Description>
    <Details>Velvet Playbook - delivers extreme performance, refined visuals, privacy, and responsiveness.</Details>
    <Version>1.0</Version>
    <UniqueId>6a93ec26-284d-4943-9fc4-c9616def55c6</UniqueId>
    <UpgradableFrom>any</UpgradableFrom>
    <Git>https://github.com/velvet-project/velvet-playbook</Git>

    <!-- Supported Windows Builds -->
    <SupportedBuilds>
        <string>19044</string>
        <string>19045</string>
        <string>22631</string>
        <string>26100</string>
        <string>26200</string>
        <string>28000</string>
        <string>26300</string>
    </SupportedBuilds>

    <!-- Prerequisites & Requirements Check -->
    <Requirements>
        <Requirement>NoPendingUpdates</Requirement>
        <Requirement>NoAntivirus</Requirement>
        <Requirement>Internet</Requirement>
        <Requirement>PluggedIn</Requirement>
    </Requirements>

    <UseKernelDriver>false</UseKernelDriver>
    <ProductCode>32</ProductCode>
    <SupportsISO>true</SupportsISO>

    <!-- ISO Media Settings -->
    <ISO>
        <DisableBitLocker>true</DisableBitLocker>
        <DisableHardwareRequirements>true</DisableHardwareRequirements>
    </ISO>

    <!-- OOBE Screen Information -->
    <OOBE>
        <BulletPoints>
            <BulletPoint Icon="Rocket" Title="Performance Boost" Description="Optimized resource usage, low latency, and maximized system responsiveness."/>
            <BulletPoint Icon="Privacy" Title="Enhanced Privacy" Description="Disabled background telemetry and diagnostic tracking services."/>
            <BulletPoint Icon="Lock" Title="Clean &amp; Lightweight" Description="Debloated system with essential software packages pre-configured."/>
        </BulletPoints>
        <Internet>Force</Internet>
    </OOBE>

    <!-- Feature Pages (Enforced globally without interactive prompts) -->
    <FeaturePages>
        <CheckboxPage IsRequired="true" Description="All Velvet optimizations, themes, settings, and packages are applied automatically.">
            <Options>
                <CheckboxOption IsChecked="true" IsEnabled="false">
                    <Text>Remove Edge, OneDrive, Copilot &amp; bloatware</Text>
                    <Name>remove-bloatware</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true" IsEnabled="false">
                    <Text>Apply Velvet system, theme &amp; registry optimizations</Text>
                    <Name>apply-optimizations</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true" IsEnabled="false">
                    <Text>Install essential software packages</Text>
                    <Name>install-software</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
    </FeaturePages>
</Playbook>
